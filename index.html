<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 6-band: Telegram WebView index.html'ning O'ZINI ba'zan uzoq vaqt
       keshlab qo'yadi — shunda pastdagi ?v= raqamlarini oshirish ham
       yordam bermaydi, chunki WebView yangi index.html'ni umuman qayta
       so'ramaydi. Bu meta teglar entry-document'ni keshlashni butunlay
       o'chiradi (child fayllar — JS/CSS — o'zining ?v= versiyalanishi
       bilan hali ham to'g'ri keshlanaveradi, faqat shu bitta sahifa emas). -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>UStorE - Telegram Mini App & ERP</title>
  <!-- Tashqi manbalarga oldindan ulanish — sahifa ochilishini biroz tezlashtiradi -->
  <link rel="preconnect" href="https://telegram.org">
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="./ustore.css?v=331">
  <link rel="stylesheet" href="./shop-welcome.css?v=20261009t1">
  <script src="./shop-welcome.js?v=20261009t1"></script>
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script async src="https://unpkg.com/lucide@latest" onload="window.safeCreateIcons?.()"></script>
  <script id="ustore-storage-sdk" async src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" onerror="this.dataset.failed='true'"></script>
  <!-- PERFORMANCE ROUND 1 (2026-09-03): Leaflet CSS/JS bu yerdan olib
       tashlandi — u faqat admin "Do'kon haqide -> Koordinata -> Xaritadan
       tanlash" tugmasini bosganda kerak, lekin oldin HAR safar ilova
       ochilganda (hech kim xaritani ochmasa ham) yuklanardi. Endi
       ensureLeafletLoaded() (ustore-shop-app.js) uni faqat shu tugma
       bosilganda, ensureScript() bilan bir xil naqshda, lazy yuklaydi —
       xarita picker'ning o'zi (openOsmCoordinatePicker) allaqachon shu
       funksiyani await qilib, yuklanish-xatosi holatini ham to'g'ri
       ko'rsatadi, shuning uchun boshqa hech narsa o'zgarmaydi.
       PDF kutubxonalari ham xuddi shunday — birinchi kirishni
       to'smasligi uchun faqat eksport bosilganda ustore-shop-app.js
       orqali yuklanadi. -->
  <script defer src="./ustore-image-io.js?v=3"></script>
  <script defer src="./ustore-commerce.js?v=8"></script>
  <script defer src="./config.public.js?v=4"></script>
  <script defer src="./web/shared/miniapp-frame-bridge.js?v=5"></script>
  <script defer src="./ustore-shop-app.js?v=333"></script>
</head>
<body class="bg-gray-100 text-gray-800 pb-20 font-sans">
  <!-- First paint: same shared welcome as Web; dismissed after storefront readiness. -->
  <section id="ustore-shop-welcome" class="uw-shop-opening ustore-welcome" role="status" aria-busy="true">
    <div class="ustore-welcome__art" aria-hidden="true"></div>
    <div class="ustore-welcome__content">
      <div class="ustore-welcome__glass"><span class="ustore-welcome__logo"><span class="ustore-welcome__monogram">U</span></span></div>
      <h1 class="ustore-welcome__title"><span class="ustore-welcome__name">Do‘kon</span><span class="ustore-welcome__greeting">Xush kelibsiz</span></h1>
      <div class="ustore-welcome__dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="ustore-welcome__error" hidden></div>
    </div>
  </section>

  <!-- HEADER -->
  <header class="ustore-topbar bg-white sticky top-0 z-40 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2 min-w-0">
      <!-- Desktop/tablet: shop logo is also the shortest path back to Home. -->
      <button type="button" id="header-home-logo-btn" class="ustore-header-home-logo" onclick="switchTab('home')" aria-label="Bosh sahifa" title="Bosh sahifa">
        <img id="header-shop-logo" class="hidden ustore-header-logo" alt="">
        <span id="header-shop-logo-wordmark" class="hidden ustore-header-wordmark"></span>
      </button>
      <span id="role-tag" class="hidden bg-slate-900 text-white font-black px-2.5 py-1 rounded-xl text-[10px] tracking-widest border border-amber-400 text-amber-400 shrink-0"></span>
    </div>
    <nav class="ustore-desktop-nav" aria-label="Do‘kon bo‘limlari">
      <div class="ustore-desktop-search"><i data-lucide="search" aria-hidden="true"></i><input id="desktop-search-input" type="search" oninput="desktopSearchInput(this.value)" onkeydown="if(event.key==='Enter')desktopSearchSubmit()" autocomplete="off" aria-label="Mahsulot qidirish" placeholder="Mahsulot, kategoriya yoki brend qidiring"><button type="button" onclick="openCategoryFilterModal()" id="desktop-filter-btn" title="Filtr" aria-label="Filtr"><i data-lucide="sliders-horizontal"></i></button></div>
      <button type="button" data-desktop-tab="home" id="desktop-nav-home-btn" onclick="switchTab('home')" title="Bosh sahifa" hidden><i data-lucide="house"></i><span id="desktop-nav-home">Bosh sahifa</span></button>
      <button type="button" data-desktop-tab="categories" onclick="switchTab('categories')" title="Kategoriyalar"><i data-lucide="layout-grid"></i><span id="desktop-nav-categories">Kategoriyalar</span></button>
      <button type="button" data-desktop-tab="warehouse" id="desktop-nav-warehouse-btn" onclick="switchTab('warehouse')" hidden><i data-lucide="warehouse"></i><span id="desktop-nav-warehouse">Ombor</span></button>
    </nav>
    <div class="ustore-header-actions flex items-center space-x-2">
      <button type="button" class="ustore-desktop-action" data-desktop-tab="orders" onclick="switchTab('orders')" title="Buyurtmalar" aria-label="Buyurtmalar"><i data-lucide="package"></i><span id="desktop-nav-orders">Buyurtmalar</span></button>
      <button type="button" class="ustore-desktop-action" data-desktop-tab="profile" id="desktop-admin-panel-btn" onclick="switchTab('profile')" title="Admin panel" aria-label="Admin panel" hidden><i data-lucide="layout-dashboard"></i><span id="desktop-nav-admin-panel">Admin panel</span></button>
      <button type="button" class="ustore-desktop-action" data-desktop-tab="cart" id="desktop-nav-cart-btn" onclick="switchTab('cart')" title="Savatcha" aria-label="Savatcha"><i data-lucide="shopping-bag"></i><span id="desktop-nav-cart">Savatcha</span><small id="desktop-cart-count" hidden>0</small></button>
      <!-- Foydalanuvchi qaytardi: savatcha tugmasi FAQAT admin rejimida
           yashiriladi (updateHeaderChrome()da), oddiy mijoz uchun header'da
           ko'rinadi — pastki menyudagi savatcha bilan bir qatorda. -->
      <button onclick="switchTab('cart')" class="relative p-2 bg-gray-100 rounded-full" id="header-cart-btn" aria-label="Savatcha" title="Savatcha">
        <i data-lucide="shopping-cart" class="w-5 h-5 text-gray-700"></i>
        <span id="cart-badge" class="hidden absolute -top-1 -right-1 fc-bg-danger text-white text-[10px] font-bold w-4 h-4 rounded-full items-center justify-center">0</span>
      </button>
      <!-- 4-band: BAYROQ -> ODAMCHA -> SOZLAMA ketma-ketligi (savatchadan keyin). -->
      <button onclick="toggleUiLang()" class="p-2 bg-gray-100 rounded-full text-base leading-none" id="lang-flag-btn" title="Til / Язык" aria-label="O‘zbek tiliga o‘tish"><svg class="fc-lang-flag-svg" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" rx="2" fill="#1eb5e9"/><rect y="6.2" width="30" height="1" fill="#ce1126"/><rect y="7.2" width="30" height="5.6" fill="#fff"/><rect y="12.8" width="30" height="1" fill="#ce1126"/><rect y="13.8" width="30" height="6.2" fill="#1eb53a"/><circle cx="5.4" cy="4" r="2.15" fill="#fff"/><circle cx="6.2" cy="3.7" r="2.15" fill="#1eb5e9"/><g fill="#fff"><circle cx="9.2" cy="2.1" r=".45"/><circle cx="11" cy="2.1" r=".45"/><circle cx="12.8" cy="2.1" r=".45"/><circle cx="10.1" cy="3.7" r=".45"/><circle cx="11.9" cy="3.7" r=".45"/><circle cx="9.2" cy="5.25" r=".45"/><circle cx="11" cy="5.25" r=".45"/></g></svg></button>
      <button type="button" onclick="toggleUiLang()" class="ustore-desktop-lang" id="desktop-lang-btn" title="Til / Язык" aria-label="Til / Язык"><span class="ustore-desktop-flag-placeholder" aria-hidden="true"></span></button>
      <button type="button" onclick="togglePersonMenu(event)" class="ustore-desktop-role-switch" id="desktop-role-switch-btn" aria-label="Admin/User rejimini almashtirish" title="Admin/User" hidden><i data-lucide="user-round-cog"></i></button>
      <button type="button" onclick="switchTab('profile')" class="ustore-desktop-profile" data-desktop-tab="profile" id="desktop-profile-btn" aria-label="Profil"><i data-lucide="user"></i><span id="desktop-nav-profile">Profil</span></button>
      <button onclick="switchTab('profile')" class="p-2 bg-gray-100 rounded-full" id="header-person-btn" aria-label="Profil" title="Profil">
        <i data-lucide="user" class="w-5 h-5 text-gray-700"></i>
      </button>
    </div>
    <!-- 17-band: top/left endi togglePersonMenu() orqali JS'da dinamik
         o'rnatiladi (personBtn.getBoundingClientRect() asosida) — bu yerdagi
         klasslar faqat position/z-index/ko'rinish uchun. -->
    <div id="role-mode-popover" class="hidden fixed z-50 bg-white rounded-xl shadow-lg border overflow-hidden"></div>
  </header>

  <!-- MAIN CONTAINER -->
  <main id="app-content" class="p-4 max-w-md mx-auto min-h-screen">
    <div class="fc-initial-loader flex flex-col items-center justify-center py-20 text-gray-400">
      <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs font-bold">Yuklanmoqda...</p>
    </div>
  </main>

  <!-- GLOBAL LOADING OVERLAY -->
  <div id="global-loader" class="hidden fixed inset-0 bg-black/40 z-[999] flex items-center justify-center">
    <div class="bg-white rounded-2xl px-6 py-5 flex flex-col items-center gap-3 shadow-xl">
      <div class="w-9 h-9 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
      <p id="global-loader-text" class="text-xs font-bold text-gray-700">Yuklanmoqda...</p>
    </div>
  </div>

  <!-- NON-BLOCKING ACTION STATUS -->
  <div id="action-toast" class="hidden" data-state="saving" aria-live="polite"></div>

  <!-- BOTTOM NAVIGATION -->
  <!-- 7-band: z-50 — #page-container (z-40, "to'liq sahifa" ko'rinishlari:
       Sozlamalar/Qo'llab-quvvatlash va h.k.) ustidan ko'rinib turishi uchun;
       avval ikkalasi ham z-40 edi, DOM tartibida keyingisi (page-container)
       uni to'liq yopib qo'yardi. -->
  <nav class="ustore-bottom-nav fixed bottom-0 left-0 right-0 bg-white py-2 px-3 flex justify-around items-center z-50">
    <button onclick="switchTab('home')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-home">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1" id="nav-label-home">Bosh sahifa</span>
    </button>
    <button onclick="switchTab('categories')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-categories">
      <i data-lucide="folder" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1" id="nav-label-categories">Kataloglar</span>
    </button>
    <button onclick="switchTab('cart')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-cart">
      <i data-lucide="shopping-bag" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1" id="nav-label-cart">Savatcha</span>
    </button>
    <button onclick="switchTab('orders')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-orders">
      <i data-lucide="package" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1" id="nav-label-orders">Buyurtmalar</span>
    </button>
    <button onclick="switchTab('warehouse')" id="nav-warehouse-btn" class="nav-btn hidden flex-col items-center text-gray-500">
      <i data-lucide="warehouse" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1" id="nav-label-warehouse">Ombor</span>
    </button>
    <button onclick="switchTab('profile')" class="nav-btn flex flex-col items-center text-gray-500" id="nav-profile">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-[10px] mt-1" id="nav-label-profile">Profil</span>
    </button>
  </nav>

  <!-- FULL PAGES (page-shell) — POLISH ROUND 1-bosqich: Qo'llab-quvvatlash/Sozlamalar/
       Dashboard/Ombor-Holat kabi bo'limlar shu yerga renderPageShell() orqali chiqadi.
       Modal-dan farqi: orqa fon xira (backdrop) emas, to'liq sahifa, bottom-nav'ni qoplaydi. -->
  <div id="page-container" class="hidden fixed inset-0 z-40 bg-white overflow-y-auto"></div>

  <!-- MODALS CONTAINER -->
  <div id="modal-container"></div>

  <script>
    // Boot fail-safe: CDN/runtime/API xatosi sabab asosiy app kodi ishga
    // tushmay qolsa ham foydalanuvchi cheksiz spinnerda qolmaydi.
    (() => {
      let shown = false;
      const showBootFailure = () => {
        if (shown || document.body.dataset.appReady === 'true') return;
        shown = true;
        const root = document.getElementById('app-content');
        if (!root) return;
        root.innerHTML = '<div class="fc-boot-error"><strong>Ilovani ochib bo‘lmadi</strong><p>Internetni tekshiring va qayta urinib ko‘ring.</p><button type="button" onclick="location.reload()">Qayta urinish</button></div>';
        window.USTORE_SHOP_WELCOME?.dismiss?.(document.getElementById('ustore-shop-welcome'), { immediate:true });
        window.USTORE_FRAME_BRIDGE?.appReady?.();
      };
      window.addEventListener('error', (event) => {
        if (event.target?.id === 'ustore-storage-sdk' || String(event.target?.src || '').includes('unpkg.com/lucide')) return;
        setTimeout(showBootFailure, 0);
      });
      window.addEventListener('unhandledrejection', () => setTimeout(showBootFailure, 0));
      setTimeout(showBootFailure, 15000);
    })();
  </script>

</body>
</html>
