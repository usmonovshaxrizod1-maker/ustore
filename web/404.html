<body>
  <a class="uw-skip-link" href="#uw-main-content">Asosiy qismga o‘tish</a>
  <div id="ustore-web-app" aria-live="polite">
    <section class="uw-launch uw-launch--platform" role="status" aria-live="polite" aria-busy="true">
      <div class="uw-launch__inner">
        <div class="uw-launch__brand"><span class="uw-launch__monogram">U</span><div class="uw-launch__brand-copy"><span class="uw-launch__eyebrow">USTORE</span><h1>UStorE</h1></div></div>
        <div class="uw-launch__loader" aria-hidden="true"><span></span><span></span><span></span></div>
        <p class="uw-launch__message">Biznesingiz uchun platforma tayyorlanmoqda…</p>
        <small class="uw-launch__foot">Xavfsiz ulanish va kerakli modullar yuklanmoqda</small>
      </div>
    </section>
    <section class="uw-shop-opening uw-initial-shop-opening ustore-welcome" role="status" aria-busy="true">
      <div class="ustore-welcome__art" aria-hidden="true"></div>
      <div class="ustore-welcome__content">
        <div class="ustore-welcome__glass"><span class="ustore-welcome__logo"><span class="ustore-welcome__monogram">U</span></span></div>
        <h1 class="ustore-welcome__title"><span class="ustore-welcome__name">Do‘kon</span><span class="ustore-welcome__greeting">Xush kelibsiz</span></h1>
        <div class="ustore-welcome__dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="ustore-welcome__error" hidden></div>
      </div>
    </section>
    <section class="uw-auth-transition" role="status" aria-live="polite" aria-busy="true">Kirish yakunlanmoqda…</section>
  </div>
  <noscript>UStorE web ilovasi uchun JavaScript yoqilgan bo‘lishi kerak.</noscript>
