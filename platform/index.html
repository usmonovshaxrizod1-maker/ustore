<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 6-band: Telegram WebView index.html'ning O'ZINI keshlab qo'yishi
       mumkin — shunda child fayllar ?v= raqami oshirilsa ham eski nusxa
       ko'rinaveradi (WebView yangi index.html'ni umuman qayta so'ramaydi).
       Bu entry-document'ning keshlanishini butunlay o'chiradi. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>UStorE Boshqaruv Paneli</title>
  <link rel="preconnect" href="https://telegram.org">
  <link rel="stylesheet" href="./platform.css?v=22">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- 6-band: reuses the root config.public.js (same Supabase project URL
       and publishable key) rather than duplicating it — one source of
       truth for the value that must stay in sync with the deployed
       Edge Functions. -->
  <script defer src="../config.public.js?v=1"></script>
  <script defer src="./platform-app.js?v=30"></script>
</head>
<body>
  <div id="app"></div>
</body>
</html>
