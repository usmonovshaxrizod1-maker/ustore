              outOfStock: 0, lowStock: 0, lowStockThreshold: 5, generatedAt: new Date().toISOString(),
            });
          default:
            return respond({ ok:true, fulfillmentConfig: mockConfig, orders: mockOrders, admins: [] });
        }
      }
      return nativeFetch(url, options);
    };

  </script>
